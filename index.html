<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gph的个人主页</title>
    <style>
        :root {
            --primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass: rgba(255, 255, 255, 0.15);
            --shadow: 0 25px 60px rgba(102, 126, 234, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: var(--shadow);
            overflow: hidden;
            animation: fadeUp 0.8s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: var(--primary);
            padding: 50px 20px 40px;
            text-align: center;
        }

        .avatar {
            width: 130px;
            height: 130px;
            margin: 0 auto 18px;
            border-radius: 50%;
            overflow: hidden;
            animation: pulse 3s infinite;
            box-shadow: 0 0 0 6px rgba(255,255,255,0.3);
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 6px rgba(255,255,255,0.3); }
            50% { box-shadow: 0 0 0 12px rgba(255,255,255,0.15); }
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .name {
            font-size: 32px;
            font-weight: 700;
            color: white;
            letter-spacing: 1px;
        }

        .content {
            padding: 30px 24px;
        }

        .info-item {
            display: flex;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .icon {
            width: 44px;
            height: 44px;
            background: var(--primary);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-right: 14px;
        }

        .info-label {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
        }

        .info-value {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin: 30px 0 16px;
        }

        .hobby-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tag {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
        }

        .tag:hover {
            background: var(--primary);
            transform: scale(1.08);
        }

        .photo-link {
            display: block;
            margin-top: 28px;
            padding: 16px;
            text-align: center;
            font-weight: 700;
            font-size: 16px;
            color: white;
            border-radius: 16px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            text-decoration: none;
            box-shadow: 0 10px 30px rgba(240, 147, 251, 0.4);
            transition: all 0.3s ease;
        }

        .photo-link:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(240, 147, 251, 0.6);
        }

        .footer {
            text-align: center;
            padding: 18px;
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            background: rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <a href="jpg.html" target="_blank">
            <div class="avatar">
                <img src="local_photo/jpg/origin/papadog.jpg" alt="头像">
            </div>
        </a>
        <h1 class="name">流水沟 沟长</h1>
    </div>

    <div class="content">
        <div class="info-item">
            <div class="icon">👨</div>
            <div class="info-text">
                <div class="info-label">性别</div>
                <div class="info-value">男</div>
            </div>
        </div>

        <div class="info-item">
            <div class="icon">🎂</div>
            <div class="info-text">
                <div class="info-label">年龄</div>
                <div class="info-value">1998年8月</div>
            </div>
        </div>

        <div class="info-item">
            <div class="icon">📍</div>
            <div class="info-text">
                <div class="info-label">居住城市</div>
                <div class="info-value">上海</div>
            </div>
        </div>
        <!-- 🛵 坐骑 -->
        <div class="info-item">
            <div class="icon">🛵</div>
            <div class="info-text">
                <div class="info-label">坐骑</div>
                <div class="info-value">新日电动车（全款购买）</div>
            </div>
        </div>
        <!-- 🏀 喜欢的明星 -->
        <div class="info-item">
            <div class="icon">🏀</div>
            <div class="info-text">
                <div class="info-label">喜欢的明星</div>
                <div class="info-value">蔡徐坤</div>
            </div>
        </div>

        <!-- 🎲 今日运势 -->
        <div class="info-item">
            <div class="icon">🎲</div>
            <div class="info-text">
                <div class="info-label">今日运势</div>
                <div class="info-value" id="luck">点击试试</div>
            </div>
        </div>

        <!-- 🎵 抖音号 -->
        <div class="info-item">
            <div class="icon">🎵</div>
            <div class="info-text">
                <div class="info-label">抖音号</div>
                <div class="info-value">62293149148</div>
            </div>
        </div>

        <!-- ✨ 个性签名 -->
        <div class="info-item">
            <div class="icon">✨</div>
            <div class="info-text">
                <div class="info-label">个性签名</div>
                <div class="info-value" style="font-size: 14px; line-height: 1.5;">
                    比世人目光还要可怕的是你那颗在意世人目光的心
                </div>
            </div>
        </div>

        <div class="hobbies">
            <h3 class="section-title">兴趣爱好</h3>
            <div class="hobby-tags">
                <span class="tag">📚 看小说</span>
                <span class="tag">📺 追剧</span>
                <span class="tag">🎮 打游戏</span>
                <span class="tag">🏞️ 周末打卡</span>
                <span class="tag">💻 研究互联网技术</span>
            </div>
        </div>

        <a href="http://47.100.126.39:80/photo/jpg.html" class="photo-link" target="_blank">
            📸 点击查看我的照片集
        </a>
    </div>

    <div class="footer">
        你已经在这个页面停留了 <span id="timeSpent">0</span> 秒 ✨
    </div>
</div>

<script>

// 今日运势
const luck = ["拯救全人类", "躺平", "发呆", "玩游戏", "搬砖", "看电视", "学习", "摆烂"];
document.getElementById("luck").onclick = () => {
    document.getElementById("luck").textContent =
        luck[Math.floor(Math.random() * luck.length)];
};
/* 停留时间 */
let seconds = 0;
setInterval(() => {
    seconds++;
    document.getElementById("timeSpent").textContent = seconds;
}, 1000);
</script>

</body>
</html>
